name: Prepare licensed Xian images

on:
  push:
    branches: [main]
    paths:
      - scripts/download-images.js
      - .github/workflows/prepare-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run images:download
      - uses: actions/upload-artifact@v4
        with:
          name: xian-licensed-images
          path: public/assets/*.webp
          if-no-files-found: error
          retention-days: 1
