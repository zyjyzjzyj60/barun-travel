 <!DOCTYPE html>
 <html lang="ko"><head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
 <title>管理 登录 | 巴伦旅游</title>
 <link rel="stylesheet" href="/style.css">
 </head><body>
 <div class="login-page">
   <div class="login-card">
     <div style="text-align:center;margin-bottom:20px"><div style="font-size:40px;margin-bottom:8px">🔐</div><h1>管理 登录</h1></div>
     <form onsubmit="handleLogin(event)">
       <div class="form-group"><label>账号</label><input id="loginId" value="admin"></div>
       <div class="form-group"><label>密码</label><input id="loginPw" type="password" value="barun1234"></div>
       <div id="loginError" class="error" style="display:none"></div>
       <button type="submit">登录</button>
     </form>
     <p class="hint">测试账号: admin / barun1234</p>
   </div>
 </div>
 <script>
 async function handleLogin(e) {
   e.preventDefault();
   const res = await fetch("/api/admin/login", {
     method: "POST",
     headers: {"Content-Type":"application/json"},
     body: JSON.stringify({ id: document.getElementById("loginId").value, pw: document.getElementById("loginPw").value })
   });
   if(res.ok) { sessionStorage.setItem("admin", "true"); window.location.href = "/admin-orders.html"; }
   else { document.getElementById("loginError").textContent = "账号 또는 密码가 올바르지 않습니다."; document.getElementById("loginError").style.display = "block"; }
 }
 if(sessionStorage.getItem("admin") === "true") window.location.href = "/admin-orders.html";
 </script>
 </body></html>
