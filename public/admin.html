<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巴伦旅游｜演示站后台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="admin-header"><a class="brand" href="/"><span class="brand-mark">BT</span><span>巴伦旅游<small>演示站运营后台</small></span></a><a href="/">返回前台 ↗</a></header><main class="admin-main"><section id="loginPanel" class="login-panel"><p class="eyebrow">STAFF ACCESS</p><h1>运营后台</h1><p>管理员账号仅由部署环境变量初始化，不使用演示默认密码。</p><form id="loginForm"><label>账号<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-dark">登录后台 →</button><p id="loginMessage" class="form-message"></p></form></section><section id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">XI'AN 3N4D · DEMO OPS</p><h1>团期与测试订单</h1></div><button id="logout" class="button button-ghost">退出登录</button></div><div class="admin-grid"><section class="admin-card"><h2>新增测试团期</h2><form id="departureForm" class="departure-form"><label>出发日期<input name="travelDate" type="date" required></label><label>成人价（韩元）<input name="adultPrice" type="number" min="0" value="949000" required></label><label>儿童价（韩元）<input name="childPrice" type="number" min="0" value="949000" required></label><label>婴儿价（韩元）<input name="infantPrice" type="number" min="0" value="200000" required></label><label>可售名额<input name="capacity" type="number" min="1" value="20" required></label><label>备注<input name="note" maxlength="100" placeholder="例如：测试团期"></label><label class="switch"><input name="isOnSale" type="checkbox" checked> 立即在前台开放预订</label><button class="button button-red">保存团期 →</button><p id="departureMessage" class="form-message"></p></form></section><section class="admin-card"><h2>当前团期</h2><div id="adminDepartures" class="admin-list"></div></section></div><section class="admin-card orders"><div class="orders-head"><div><h2>测试订单</h2><p>仅显示演示联系人资料；本演示站不收集护照信息。</p></div><button id="refreshOrders" class="button button-ghost">刷新</button></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>出发日</th><th>人数</th><th>测试联系人</th><th>金额</th><th>状态</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></section></main><script src="/admin.js"></script></body></html>
