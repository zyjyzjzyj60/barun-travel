<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운영자 | 바른투어</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body"><header class="admin-header"><a class="wordmark" href="/"><span class="wordmark-seal">B</span><span>바른투어<small>BARUN TRAVEL / OPS</small></span></a><a href="/">공개 사이트로 ↗</a></header><main class="admin-main"><section id="loginPanel" class="login-panel"><p class="mono-label">STAFF ACCESS</p><h1>운영자 로그인</h1><p>관리자 계정은 배포 환경 변수로 초기화됩니다. 공개 시연용 기본 비밀번호는 사용하지 않습니다.</p><form id="loginForm"><label>아이디<input name="username" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">로그인 →</button><p class="form-message" id="loginMessage"></p></form></section><section id="dashboard" hidden><div class="admin-title"><div><p class="mono-label">DEMO OPERATIONS</p><h1>출발일과 테스트 주문</h1></div><button id="logout" class="admin-button" type="button">로그아웃</button></div><div class="admin-grid"><section class="admin-card"><h2>시연 출발일 추가</h2><form id="departureForm" class="departure-form"><label class="full">여행 상품<select id="productSelect" name="productId" required></select></label><label>출발일<input name="travelDate" type="date" required></label><label>좌석 수<input name="capacity" type="number" min="1" value="20" required></label><label>성인 가격 (원)<input name="adultPrice" type="number" min="0" value="949000" required></label><label>아동 가격 (원)<input name="childPrice" type="number" min="0" value="849000" required></label><label>유아 가격 (원)<input name="infantPrice" type="number" min="0" value="150000" required></label><label class="full">메모<input name="note" maxlength="100" placeholder="공개 시연 출발일"></label><label class="switch"><input name="isOnSale" type="checkbox" checked> 공개 사이트에서 테스트 예약 열기</label><button class="primary-button" type="submit">출발일 저장 →</button><p id="departureMessage" class="form-message"></p></form></section><section class="admin-card"><h2>현재 출발일</h2><div id="adminDepartures" class="admin-list"></div></section></div><section class="admin-card orders"><div class="orders-head"><div><h2>테스트 주문</h2><p>이 공개 시연에서는 테스트 연락처와 인원만 저장합니다. 여권 정보는 수집하지 않습니다.</p></div><button id="refreshOrders" class="admin-button" type="button">새로고침</button></div><div class="table-wrap"><table><thead><tr><th>주문 번호</th><th>상품</th><th>출발일</th><th>인원</th><th>테스트 연락처</th><th>금액</th><th>상태</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></section></main><script src="/admin.js"></script></body></html>
