<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片来源与授权｜巴伦旅游</title><link rel="stylesheet" href="/style.css"><style>.attribution{max-width:900px;margin:auto;padding:80px 30px}.attribution h1{font:700 46px 'Noto Serif SC';margin:0}.attribution>p{color:#697487;max-width:650px}.credit-list{border-top:2px solid #10223f;margin-top:40px}.credit{display:grid;grid-template-columns:130px 1fr;gap:25px;padding:25px 0;border-bottom:1px solid #d7d5ce}.credit img{width:130px;height:90px;object-fit:cover}.credit h2{font:700 21px 'Noto Serif SC';margin:0}.credit p{margin:6px 0;font-size:13px;color:#596578}.credit a{color:#c94335;text-decoration:underline}@media(max-width:600px){.attribution{padding:50px 20px}.credit{grid-template-columns:1fr}.credit img{width:100%;height:180px}}</style></head><body><div class="demo-bar">巴伦旅游西安演示站 · 图片来源与授权</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark">BT</span><span>巴伦旅游<small>BARUN TRAVEL</small></span></a><nav><a href="/">返回产品页</a><a class="admin-link" href="/admin.html">运营后台</a></nav></header><main class="attribution"><p class="eyebrow">IMAGE CREDITS</p><h1>景点照片的来源与授权</h1><p>所有图片均从 Wikimedia Commons 下载并以本地 WebP 文件提供。我们保留作者、原始页面与授权协议；本页会随每次新增路线继续更新。</p><div id="credits" class="credit-list"></div></main><script>fetch('/api/product').then(r=>r.json()).then(p=>document.getElementById('credits').innerHTML=p.images.map(i=>`<article class="credit"><img src="${i.url}" alt="${i.alt}"><div><h2>${i.alt}</h2><p>作者：${i.author} · 授权：<a href="${i.licenseUrl}" target="_blank" rel="noopener">${i.license}</a></p><p><a href="${i.sourceUrl}" target="_blank" rel="noopener">查看原始图片与完整授权说明 ↗</a></p></div></article>`).join('')).catch(()=>document.getElementById('credits').textContent='暂时无法读取图片资料。')</script></body></html>
