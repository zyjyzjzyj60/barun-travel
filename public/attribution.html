<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 출처 | 바른투어</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body class="simple-page"><header class="main-header"><a class="wordmark" href="/"><span class="wordmark-seal">B</span><span>바른투어<small>BARUN TRAVEL</small></span></a><nav class="main-nav"><a href="/">여행 찾기</a><a class="staff-link" href="/admin.html">운영자</a></nav></header><main class="simple-main"><p class="mono-label">IMAGE CREDITS</p><h1>이미지 출처와<br>이용 허가.</h1><p class="lead">공개 사이트의 장면은 외부 여행 사이트에서 직접 불러오지 않습니다. 각 이미지의 작가, 라이선스, 원본 페이지를 아래에 남깁니다.<br>本站景点图片本地部署，不热链旅行网站；保留每张图片的作者、许可与原始来源。</p><div class="credit-list" id="credits"><p class="loading-state">이미지 정보를 불러오는 중입니다…</p></div></main><script>
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bi=v=>`${esc(v?.ko||'')}<small>${esc(v?.zh||'')}</small>`;
(async()=>{const credits=document.getElementById('credits');try{const products=await (await fetch('/api/products')).json();const details=await Promise.all(products.map(async p=>({p,data:await (await fetch('/api/products/'+encodeURIComponent(p.id))).json()})));const items=details.flatMap(({p,data})=>data.images.map(image=>({p,image})));credits.innerHTML=items.length?items.map(({p,image})=>`<article class="credit-item"><img src="${esc(image.url)}" alt="${esc(image.alt.ko)}"><div><p class="mono-label">${esc(p.title.ko)} / ${esc(p.title.zh)}</p><h2>${bi(image.alt)}</h2><p>작가 / 作者: ${esc(image.author)} · 라이선스 / 协议: <a href="${esc(image.licenseUrl)}" target="_blank" rel="noopener">${esc(image.license)}</a></p><p><a href="${esc(image.sourceUrl)}" target="_blank" rel="noopener">원본 이미지와 전체 라이선스 보기 ↗</a></p></div></article>`).join(''):'<p class="loading-state">이미지 라이선스 자료를 준비 중입니다.</p>';}catch(error){credits.innerHTML='<p class="loading-state is-error">이미지 정보를 불러올 수 없습니다.</p>';}})();
</script></body></html>
